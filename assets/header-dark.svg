<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Namruth S — Embedded Systems, Robotics, Firmware">
  <style>
    .name{font:600 54px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3;letter-spacing:1px}
    .role{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3;opacity:.85}
    .mono{font:400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590}
    .lbl{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590}
    .sig{fill:none;stroke:#58a6ff;stroke-width:1.6;stroke-linejoin:miter}
    .grid{stroke:#21262d;stroke-width:1}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="10" fill="#0d1117" stroke="#30363d"/>

  <!-- identity -->
  <text x="56" y="112" class="name">Namruth S</text>
  <text x="58" y="150" class="role">Embedded Systems · Robotics · Firmware</text>
  <text x="58" y="200" class="mono">Bengaluru, IN  ·  B.Tech ECE, REVA University '26</text>

  <!-- gait phase timing diagram: 4-beat wave gait, high = stance, low = swing -->
  <text x="660" y="40" class="mono">RÄIQKÖNEN  ·  wave gait  ·  duty β = 0.75</text>
  <g class="grid">
    <line x1="660" y1="56" x2="660" y2="218"/><line x1="722.5" y1="56" x2="722.5" y2="218" stroke-dasharray="2 4"/>
    <line x1="785" y1="56" x2="785" y2="218" stroke-dasharray="2 4"/><line x1="847.5" y1="56" x2="847.5" y2="218" stroke-dasharray="2 4"/>
    <line x1="910" y1="56" x2="910" y2="218"/><line x1="972.5" y1="56" x2="972.5" y2="218" stroke-dasharray="2 4"/>
    <line x1="1035" y1="56" x2="1035" y2="218" stroke-dasharray="2 4"/><line x1="1097.5" y1="56" x2="1097.5" y2="218" stroke-dasharray="2 4"/>
    <line x1="1160" y1="56" x2="1160" y2="218"/>
  </g>
  <text x="620" y="82" class="lbl">FL</text>
  <text x="620" y="122" class="lbl">FR</text>
  <text x="620" y="162" class="lbl">BL</text>
  <text x="620" y="202" class="lbl">BR</text>
  <path class="sig" d="M660 70 H722.5 V88 H785 V70 H972.5 V88 H1035 V70 H1160"/>
  <path class="sig" d="M660 110 H847.5 V128 H910 V110 H1097.5 V128 H1160 V110"/>
  <path class="sig" d="M660 168 H722.5 V150 H910 V168 H972.5 V150 H1160"/>
  <path class="sig" d="M660 190 H785 V208 H847.5 V190 H1035 V208 H1097.5 V190 H1160"/>
  <text x="660" y="238" class="mono">0</text>
  <text x="900" y="238" class="mono">T</text>
  <text x="1146" y="238" class="mono">2T</text>

  <!-- phase cursor -->
  <line x1="660" y1="56" x2="660" y2="218" stroke="#e6edf3" stroke-opacity=".55" stroke-width="1">
    <animate attributeName="x1" values="660;1160" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="660;1160" dur="8s" repeatCount="indefinite"/>
  </line>
</svg>
